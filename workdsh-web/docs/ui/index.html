运营平台｜项目总指令<br><br>## 一、系统定位…</p></div><div class="card"><div class="row"><strong>连接器 <span class="small">1</span></strong><button data-action="dialog" data-title="连接器">＋</button></div><p>个人授权　<span class="badge" style="display:inline-grid;background:#3672d4;color:white">文</span></p></div><div class="card"><div class="row"><strong>专家 <span class="small">4</span></strong><button data-action="dialog" data-title="项目专家">＋</button></div><div class="badges">${['质','综','生','报'].map(x=>`<span class="face">${x}</span>`).join('')}</div></div><div class="card"><div class="row"><strong>技能 <span class="small">10</span></strong><button data-action="dialog" data-title="项目技能">＋</button></div><div class="badges">${['客','综','质','生','库','报'].map(x=>`<span class="badge">${x}</span>`).join('')}</div></div><div class="card"><div class="row"><strong>定时任务 <span class="small">5</span></strong><button data-action="dialog" data-title="定时任务规划">＋</button></div><div class="schedule"><span>经营周汇总</span><small>每周 周五 · 17:00</small></div><div class="schedule is-active" title="示例：启用状态，尚未接入调度"><span>客户与报价跟进</span><small>每周 周一 · 09:00</small></div><button class="schedule-all" data-action="dialog" data-title="定时任务规划">查看全部(5)</button></div></div></section>`;$('#breadcrumb').textContent='▱ 项目 / 钣金厂智能运营平台'}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.librarySection){librarySection=b.dataset.librarySection;render()}if(b.dataset.libraryFilter){libraryFilter=b.dataset.libraryFilter;render()}if(b.dataset.action==='dismiss-guide'){b.closest('.library-guide').hidden=true}if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.projectTab){projectTab=b.dataset.projectTab;render()}if(b.id==='emptyToggle'){empty=!empty;render()}if(b.id==='close')$('#dialog').close();if(b.dataset.category){document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('#results .card').forEach(c=>c.hidden=b.dataset.category!=='全部'&&c.dataset.category!==b.dataset.category)}if(b.dataset.action==='sort'){show('排序演示','<p>当前为示例目录，尚无真实热度和发布时间。正式排序由专家服务提供。</p>')}if(b.dataset.action==='filter'){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}if(b.dataset.action==='fill'){$('textarea').value=`请帮我准备${b.dataset.title}，先梳理所需资料和工作步骤。`;$('textarea').focus()}if(b.dataset.action==='start')show('任务入口演示','<p>这份原型仅用于审阅界面。查看任务页可以了解对话、执行进度和成果的布局。</p><button class="primary" id="demoTask">查看任务布局 →</button>');if(b.id==='demoTask'){$('#dialog').close();page='task';render()}if(b.dataset.action==='preview')show('报价风险清单.md','<p>示例预览</p><h3>待核对事项</h3><ul><li>材料价格的有效日期</li><li>客户下一次跟进时间</li><li>报价是否完成审批</li></ul>');if(b.dataset.action==='dialog')show(b.dataset.title,`<p>此处预留「${esc(b.dataset.title)}」的配置与操作流程。实际数据由对应插件提供。</p><p>权限校验、保存及调用将在业务实现阶段接入。</p>`)});
document.addEventListener('input',e=>{if(e.target.matches('.search')){let count=0;document.querySelectorAll('#results .card').forEach(c=>{c.hidden=!c.textContent.includes(e.target.value.trim());if(!c.hidden)count++});if($('#noResults'))$('#noResults').hidden=count>0}});if(Object.keys(pages).concat(['task','admin']).includes(location.hash.slice(1)))page=location.hash.slice(1);render();
