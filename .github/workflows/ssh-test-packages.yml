name: DSH SSH test packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DSH_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # Desktop uses the checksum-pinned vendored runtime, not submodule source.
      # The normal CI still verifies the upstream source checkout separately.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn check:vendored-runtime
      - run: corepack yarn workspace dsh-community-market build
      - run: corepack yarn workspace dsh-plugin-desktop build
      - run: corepack yarn workspace dsh-plugin-desktop typecheck
      - run: corepack yarn workspace dsh-plugin-desktop test
      - run: corepack yarn workspace dsh-plugin-desktop verify:closure
      - run: corepack yarn workspace dsh-plugin-desktop verify:licenses
      - run: corepack yarn workspace dsh-plugin-desktop verify:notices
      - run: corepack yarn workspace dsh-plugin-desktop verify:loader
      - run: corepack yarn workspace dsh-plugin-desktop verify:profile
      - run: corepack yarn workspace dsh-plugin-desktop verify:cli
      - if: runner.os == 'macOS'
        run: corepack yarn workspace dsh-plugin-desktop package:dir
      - if: runner.os == 'macOS'
        run: node scripts/package-ssh-macos-test.mjs
      - if: runner.os == 'Windows'
        run: corepack yarn workspace dsh-plugin-desktop dist:win
      - if: runner.os == 'Windows'
        run: corepack yarn workspace dsh-plugin-desktop dist:win-portable
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-SSH-unsigned-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            dsh-plugin-desktop/dist/*.dmg
            dsh-plugin-desktop/dist/*.sha256
            dsh-plugin-desktop/dist/**/*.exe
            dsh-plugin-desktop/dist/**/*.zip
